name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  # macOS signing/notarization is optional: add CSC_LINK (base64 .p12 of a "Developer ID
  # Application" cert), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID as repository secrets and the mac jobs sign + notarize automatically.
  # Without them the builds are unsigned and the app updates itself via its own swap updater.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go vet ./... && go test ./...

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            eb: --mac --arm64
          - os: macos-14
            goos: darwin
            goarch: amd64
            eb: --mac --x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            eb: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - name: Web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Backend
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [[ "$GOOS" == "windows" ]] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "bin/ezlol$ext" ./cmd/ezlol
      - name: OCR helper (macOS)
        if: matrix.goos == 'darwin'
        run: mkdir -p bin && swiftc -O -target ${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}-apple-macos14.0 -o bin/ezlol-ocr tools/ocr/main.swift
      - name: Stamp version
        shell: bash
        working-directory: electron
        run: npm version --no-git-tag-version "${{ steps.ver.outputs.version }}" || true
      - name: Desktop app
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          extra=""
          # Secrets that are not configured arrive as empty strings; electron-builder
          # treats a defined CSC_LINK as "sign with this", so drop the empty ones.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v}" ]]; then unset "$v"; fi
          done
          if [[ "${{ matrix.goos }}" == "darwin" && -n "${CSC_LINK:-}" ]]; then
            extra="-c.mac.notarize=true"
            unset CSC_IDENTITY_AUTO_DISCOVERY
          elif [[ "${{ matrix.goos }}" != "darwin" ]]; then
            # The certificate is Apple's Developer ID; Windows must not try to sign with it.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.eb }} --publish never $extra
      - uses: actions/upload-artifact@v4
        with:
          name: ezlol-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
