name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  # No signing certificates in CI: ship unsigned builds.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go vet ./... && go test ./...

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            eb: --mac --arm64
          - os: macos-14
            goos: darwin
            goarch: amd64
            eb: --mac --x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            eb: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - name: Web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Backend
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [[ "$GOOS" == "windows" ]] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "bin/ezlol$ext" ./cmd/ezlol
      - name: Stamp version
        shell: bash
        working-directory: electron
        run: npm version --no-git-tag-version "${{ steps.ver.outputs.version }}" || true
      - name: Desktop app
        working-directory: electron
        run: npm ci --no-audit --no-fund && npx electron-builder ${{ matrix.eb }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ezlol-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
