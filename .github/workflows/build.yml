name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  # macOS signing/notarization is optional: add CSC_LINK (base64 .p12 of a "Developer ID
  # Application" cert), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID as repository secrets and the mac jobs sign + notarize automatically.
  # Without them the builds are unsigned and the app updates itself via its own swap updater.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go vet ./... && go test ./...

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
            eb: --mac --arm64
          - os: macos-15
            goos: darwin
            goarch: amd64
            eb: --mac --x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            eb: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - name: Web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Backend
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [[ "$GOOS" == "windows" ]] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "bin/ezlol$ext" ./cmd/ezlol
      - name: OCR helper (macOS)
        if: matrix.goos == 'darwin'
        run: mkdir -p bin && swiftc -O -target ${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}-apple-macos14.0 -o bin/ezlol-ocr tools/ocr/main.swift
      - name: Stamp version
        shell: bash
        working-directory: electron
        run: npm version --no-git-tag-version "${{ steps.ver.outputs.version }}" || true
      - name: Desktop app
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          extra=""
          # Secrets that are not configured arrive as empty strings; electron-builder
          # treats a defined CSC_LINK as "sign with this", so drop the empty ones.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v}" ]]; then unset "$v"; fi
          done
          if [[ "${{ matrix.goos }}" == "darwin" && -n "${CSC_LINK:-}" ]]; then
            unset CSC_IDENTITY_AUTO_DISCOVERY
            # Notarize only when Apple accepts the credentials. An expired or revoked
            # app-specific password (HTTP 401) would otherwise fail the whole build;
            # ship a signed build instead and say so on the run summary.
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]] &&
               xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null 2>notary.err; then
              extra="-c.mac.notarize=true"
            else
              why=$(grep -m1 -i 'error' notary.err 2>/dev/null | cut -c1-160 || true)
              echo "::warning title=macOS build not notarized::Apple rejected the notarization credentials (${why:-no APPLE_* secrets}). The app is signed but not notarized; renew APPLE_APP_SPECIFIC_PASSWORD at appleid.apple.com to notarize again."
              echo "**macOS ${{ matrix.goarch }}: signed, not notarized** (Apple rejected the notarization credentials)." >> "$GITHUB_STEP_SUMMARY"
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              extra="-c.mac.notarize=false"
            fi
            rm -f notary.err
          elif [[ "${{ matrix.goos }}" != "darwin" ]]; then
            # The certificate is Apple's Developer ID; Windows must not try to sign with it.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.eb }} --publish never $extra
          # Both mac jobs write latest-mac.yml; keep them apart so the release can merge them.
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.goarch }}.yml"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ezlol-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # electron-updater reads one latest-mac.yml: list the arm64 and x64 files in it
      # (arm64 stays the default path), or Intel Macs never see an update.
      - name: Merge latest-mac.yml
        run: |
          cd dist
          a=latest-mac-arm64.yml; x=latest-mac-amd64.yml
          awk 'FNR==NR { if ($0 ~ /^files:/) { f=1; next } if (f && $0 ~ /^[^ ]/) f=0; if (f) extra = extra $0 "\n"; next }
               /^path:/ && !done { printf "%s", extra; done=1 } { print }' "$x" "$a" > latest-mac.yml
          rm "$a" "$x"
          cat latest-mac.yml
          test "$(grep -c '  - url: ' latest-mac.yml)" -eq 4
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
